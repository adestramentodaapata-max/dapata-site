server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # atrás do proxy do Coolify (que cuida do HTTPS): redirecionamentos relativos, sem porta nem http://
    absolute_redirect off;

    # www -> domínio principal
    if ($host = www.dapata.com.br) { return 301 https://dapata.com.br$request_uri; }

    # links limpos: /banho-e-tosa -> banho-e-tosa.html
    rewrite ^/(.+)/$ /$1 permanent;
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri.html =404;
    }
    # /index e /x.html redirecionam para a forma limpa
    location = /index.html { return 301 /; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }
    error_page 404 /404.html;
    location = /404.html { internal; }

    # cache longo para arquivos estáticos
    location ~* \.(jpg|jpeg|png|webp|svg|woff2|css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
}
